[tool.poetry]
name = "matcha-ai"
version = "0.1.0"
description = "Multi-agent job matching system via WhatsApp Business API"
authors = ["William Hu"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
uvicorn = {extras = ["standard"], version = ">=0.25.0"}
langchain = "^0.3.0"
langchain-openai = "^0.2.0"
langsmith = ">=0.1.0"
langgraph = "^0.2.0"
supabase = "^2.9.0"
pymupdf = "^1.24.0"
httpx = ">=0.27.0"
pydantic = ">=2.7.0,<3.0.0"
pydantic-settings = "^2.6.0"
python-dotenv = "^1.0.0"
pyyaml = "^6.0.2"
chainlit = "^2.9.2"
markitdown = {extras = ["pdf", "docx"], version = "^0.1.3"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
black = "^24.8.0"
ruff = "^0.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
